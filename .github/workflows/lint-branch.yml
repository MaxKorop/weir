name: Lint Branch Name

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-branch:
    # Skip release PRs (development -> main)
    if: ${{ !(github.head_ref == 'development' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Branch Name
        run: node scripts/lint-branch.mjs "${{ github.head_ref }}"
